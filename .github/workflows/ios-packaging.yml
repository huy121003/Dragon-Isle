name: iOS Packaging Smoke Test

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "index.html"
      - "src/**"
      - "js/**"
      - "css/**"
      - "data/**"
      - "vite.config.mjs"
      - "capacitor.config.json"
      - ".github/workflows/ios-packaging.yml"

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install game dependencies
        run: npm ci

      - name: Build web assets for a local native bundle
        run: npm run build
        env:
          VITE_NATIVE_BUILD: "true"

      - name: Install Capacitor tooling
        run: npm install --no-save --package-lock=false @capacitor/core@^8 @capacitor/cli@^8 @capacitor/ios@^8

      - name: Generate iOS project and sync bundled assets
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Compile iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator build artifact
        run: |
          cd build/ios/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/Dragon-Isle-iOS-Simulator.zip"

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragon-isle-ios-simulator
          path: Dragon-Isle-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 7
