<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragon Isle · Motion Gallery</title><style>
:root{font:14px system-ui;color:#203d51;background:#dbeaf0}*{box-sizing:border-box}body{margin:0;padding:20px}header{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{margin:0 0 5px}p{margin:0 0 18px}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.group{background:#fff;border:1px solid #bccfd7;border-radius:15px;padding:11px;box-shadow:0 6px 16px #31566a26}.group h2{font-size:15px;margin:2px 0 9px}.stage{display:flex;gap:4px}.stage>div{width:33.33%;min-width:0;text-align:center}.stage canvas{width:100%;height:auto;aspect-ratio:1;background:radial-gradient(#f4faf6,#dce9eb);border-radius:9px}.stage small{font-size:10px}.toolbar{display:flex;gap:8px}button{padding:8px 12px;border:0;border-radius:9px;background:#315d72;color:white;cursor:pointer}@media(max-width:500px){body{padding:10px}.grid{grid-template-columns:1fr 1fr;gap:7px}.group{padding:6px}.group h2{font-size:11px}.stage{gap:1px}.stage small{font-size:8px}header{align-items:flex-start}}
</style></head><body><header><div><h1>Dragon Motion Gallery</h1><p>Ten pure silhouettes and hybrid tiers at young, adult and elder stages.</p></div><div class="toolbar"><button id="pause">Pause</button><button id="quality">Quality: high</button></div></header><main class="grid" id="gallery"></main><canvas id="island" width="1" height="1" hidden></canvas><div id="stage" hidden></div>
<script src="../js/data/db-cache.js"></script><script src="../data/economy.js"></script><script src="../js/data/dragon-rules.js"></script><script src="../js/data/catalog.js"></script><script src="../js/core/state.js"></script><script src="../js/render/world.js"></script><script src="../js/render/dragon-anatomy.js"></script><script src="../js/render/dragon-tertiary.js"></script><script src="../js/render/dragon-motion.js"></script><script src="../js/render/dragon-art.js"></script>
<script>
state=newGame();const examples=['fire','water','earth','wind','ice','thunder','nature','dark','light','metal','fire>water','water>earth>wind',FOUR_IDS[0]];
const gallery=document.getElementById('gallery'),cards=[];
for(const id of examples){const s=DATA.species[id];if(!s)continue;const card=document.createElement('article');card.className='group';card.innerHTML='<h2></h2><div class="stage"></div>';card.querySelector('h2').textContent=s.name+' · '+s.elements.length+' elements';
  for(const level of [1,15,40]){const box=document.createElement('div'),canvas=document.createElement('canvas');canvas.width=150;canvas.height=140;box.append(canvas);const label=document.createElement('small');label.textContent=level===1?'Young':level===15?'Adult':'Elder';box.append(label);card.querySelector('.stage').append(box);cards.push({canvas,id,level,visible:true});}
  gallery.append(card);
}
let running=true,quality=true,last=0;
const observer=new IntersectionObserver(entries=>entries.forEach(e=>{const canvases=e.target.querySelectorAll('canvas');cards.forEach(card=>{if([...canvases].includes(card.canvas))card.visible=e.isIntersecting;});}));
document.querySelectorAll('.group').forEach(node=>observer.observe(node));
function frame(time){requestAnimationFrame(frame);if(!running||time-last<33)return;last=time;
  for(const card of cards){if(!card.visible)continue;const c=card.canvas.getContext('2d');c.clearRect(0,0,150,140);
    drawDragon(c,{dragon:{id:0,species:card.id,level:card.level,hunger:10,happiness:80},x:79,y:103,time,scale:quality?.72:.62,activity:{id:'walk'}});}
}
requestAnimationFrame(frame);
document.getElementById('pause').onclick=e=>{running=!running;e.target.textContent=running?'Pause':'Play';};
document.getElementById('quality').onclick=e=>{quality=!quality;e.target.textContent='Quality: '+(quality?'high':'low');};
</script></body></html>
