<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-mascot">🐉</div><h1>Dragon Isle</h1>
    <p>Every trainer has their own island and progress.</p>
    <div class="auth-tabs"><button id="loginTab" type="button" class="btn primary" data-auth-mode="login">Sign in</button>
      <button id="registerTab" type="button" class="btn" data-auth-mode="register">Register</button></div>
    <form id="authForm" autocomplete="on">
      <label>Username<input id="authUsername" name="username" required pattern="[A-Za-z0-9_]+" autocomplete="username" placeholder="Example: alex_01"></label>
      <label>Password<input id="authPassword" name="password" type="password" required autocomplete="current-password" placeholder="Password"></label>
      <button id="authSubmit" class="btn good" type="submit">Enter island</button>
    </form>
    <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
  </div>
</section>
<div id="game" hidden>
  <header id="topbar">
    <div class="brand"><span class="brand-icon" aria-hidden="true">🐉</span><div><b>Dragon Isle</b><small id="playerLevel">Level 1</small><div class="xp-track" id="xpTrack" role="progressbar" aria-label="Player experience" aria-valuemin="0"><div id="xpFill"></div><span id="xpText">0 / 38 XP</span></div></div></div>
    <button class="account-btn" data-action="logout" title="Sign out"><span id="accountName"></span> ↪</button>
    <div class="resources" aria-label="Resources">
    <span class="resource gold" aria-label="Gold"><i>🪙</i><span id="goldAmount">500</span><small id="incomeRate">+0/min</small></span>
      <span class="resource food" aria-label="Food"><i>🍎</i><span id="foodAmount">50</span></span>
      <span class="resource gem" aria-label="Gem"><i>💎</i><span id="gemAmount">10</span></span>
    </div>
  </header>
  <main id="stage">
    <canvas id="island" aria-label="Eleven floating islands on one continuous map"></canvas>
    <div id="timersBar" aria-label="Pending activities"></div>
    <div id="hint">Tap a Habitat to collect gold · drag to move around the island</div>
    <div id="inspector"></div>
    <div id="placementBar"><span id="placementText"></span><button class="btn danger" data-action="cancel-mode">Cancel</button></div>
  </main>
  <nav id="dock" aria-label="Main menu">
    <button class="dock-btn" data-action="open-islands"><span>🗺️</span>Islands</button>
    <button class="dock-btn" data-action="open-shop"><span>🏪</span>Shop</button>
    <button class="dock-btn" data-action="open-dragons"><span>🐲</span>Dragons</button>
    <button class="dock-btn" data-action="open-book"><span>📖</span>Dragon Book<small id="collectionProgress"></small></button>
    <button class="dock-btn" data-action="open-inventory"><span>🎒</span>Inventory</button>
    <button class="dock-btn" data-action="open-guide"><span>📚</span>Hướng dẫn</button>
    <button class="dock-btn" id="arenaDockButton" data-action="open-arena" hidden><span>⚔️</span>Arena</button>
  </nav>
</div>
<div id="overlay" role="dialog" aria-modal="true" aria-label="Game dialog">
  <div id="sheet"><div class="sheet-head"><h2 id="sheetTitle" tabindex="-1"></h2><button class="btn icon" data-action="close-modal" aria-label="Close">×</button></div><div class="sheet-body" id="sheetBody"></div></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
